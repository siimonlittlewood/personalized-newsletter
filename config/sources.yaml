# Data sources for the newsletter pipeline.
# Free-tier notes are recorded here since they determine call budgets in fetch_headlines.py.

apis:
  currents:
    # https://currentsapi.services/ - 1,000 req/day free, commercial use allowed
    base_url: https://api.currentsapi.services/v1/latest-news
    categories: [world, business, technology, sports, politics]

  twelvedata:
    # https://twelvedata.com/ - 800 req/day free.
    # IMPORTANT (found by testing, not documented clearly): the free tier only
    # covers US-listed symbols. Raw indices (e.g. GSPTSE) and non-US-exchange
    # symbols (e.g. XIC.TO) 404 with "available starting with the Grow plan."
    # So: US indices go through Twelve Data via liquid ETF proxies (SPY/QQQ),
    # and anything Canadian/international goes through yfinance instead (see
    # fetch_headlines.py fetch_market() for the routing logic).
    base_url: https://api.twelvedata.com
    indices:
      - symbol: SPY
        label: S&P 500 (SPY ETF proxy)
        provider: twelvedata
      - symbol: QQQ
        label: Nasdaq (QQQ ETF proxy)
        provider: twelvedata
      - symbol: ^GSPTSE
        label: TSX Composite
        provider: yfinance

