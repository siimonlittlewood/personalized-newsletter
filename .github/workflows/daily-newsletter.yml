name: Daily newsletter

on:
  schedule:
    # Run once per day at noon UTC. GitHub may start scheduled workflows late,
    # so the guard below permits starts within one hour of the target time.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render the newsletter without sending it
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: schedule
        name: Check UTC delivery window
        shell: bash
        run: |
          utc_hour="$(date -u +%H)"
          if [[ "${{ github.event_name }}" == "schedule" && ( "$utc_hour" -lt 11 || "$utc_hour" -gt 13 ) ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.schedule.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.schedule.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run newsletter pipeline
        if: steps.schedule.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python scripts/run_newsletter.py --dry-run
          else
            python scripts/run_newsletter.py
          fi
